<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>登入｜海大活動報名系統</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="account.css"><script src="api-config.js" defer></script><script src="auth-session.js" defer></script><script src="auth-client.js" defer></script><script src="account.js" defer></script></head>
<body data-account-page="login"><header class="site-header"><div class="header-inner"><a class="brand" href="index.html">海大活動報名系統</a><a href="index.html">瀏覽活動</a></div></header>
<main class="account-shell"><section class="account-card" aria-labelledby="account-title"><p class="eyebrow">NTOU CAMPUS EVENTS</p><h1 id="account-title">登入</h1><p>歡迎回來，探索新的校園活動。</p><div id="account-status" class="account-status" role="status" aria-live="polite" tabindex="-1"></div><form id="account-form" novalidate><div><label for="email">校園 Email *</label><input id="email" name="email" type="email" autocomplete="email" maxlength="100" required aria-describedby="email-error"><span class="field-error" id="email-error"></span></div>
<div><label for="password">密碼 *</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="password-error" minlength="8"><span class="field-error" id="password-error"></span></div>
<button class="button" id="account-submit" type="submit">登入</button></form><button class="button button-outline" id="refresh-account" type="button" hidden>我已驗證，重新確認</button><nav class="account-links" aria-label="帳號服務"><a href="login.html">回登入</a><a href="register.html">建立帳號</a><a href="resend-verification.html" id="resend-link">重新寄送驗證信</a><a href="index.html">回首頁</a></nav></section></main></body></html>
